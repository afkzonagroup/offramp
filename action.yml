name: Offramp provider profile check
description: Check an Offramp provider profile (Data Act switching, Regulation (EU) 2023/2854 Chapter VI) for missing or conflicting information. Offline.
author: AFKzona Group
branding:
  icon: log-out
  color: blue
inputs:
  profile:
    description: Provider profile JSON file, relative to the workspace.
    required: true
  fail-on:
    description: Fail the step on "conflict", "missing", "review" or "never".
    default: 'conflict'
outputs:
  conflicts:
    description: Number of conflicts found by this run.
    value: ${{ steps.check.outputs.conflicts }}
  missing:
    description: Number of missing items found by this run.
    value: ${{ steps.check.outputs.missing }}
  review:
    description: Number of items to review found by this run.
    value: ${{ steps.check.outputs.review }}
  findings:
    description: Conflicts, missing items and items to review together.
    value: ${{ steps.check.outputs.findings }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - name: Install Offramp
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        npm ci --ignore-scripts --no-audit --no-fund
        npx tsc -p tsconfig.build.json
    - name: Check the provider profile
      id: check
      shell: bash
      # Inputs reach the script only through environment variables and are passed as separate arguments,
      # so they cannot inject shell code. The profile must be inside the workspace. The outputs are written
      # by Offramp itself from this run's result (integers only).
      env:
        OFFRAMP_PROFILE: ${{ inputs.profile }}
        OFFRAMP_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        case "$OFFRAMP_FAIL_ON" in conflict|missing|review|never) ;; *) echo "fail-on must be conflict, missing, review or never" >&2; exit 2 ;; esac
        # Works on Linux, macOS and Windows runners: a relative path without ".." segments, under the workspace.
        case "$OFFRAMP_PROFILE" in ""|/*|..|../*|*/..|*/../*|*$'\n'*) echo "profile must be a relative path inside the workspace" >&2; exit 2 ;; esac
        profile="$GITHUB_WORKSPACE/$OFFRAMP_PROFILE"
        node "$GITHUB_ACTION_PATH/dist/cli/main.js" profile check --fail-on "$OFFRAMP_FAIL_ON" --github-output -- "$profile"
